          (2, '计科2302班', '计算机科学与技术 2023 级 2 班（弱项画像演示）', 2, 1);

          INSERT INTO users (id, username, email, password, real_name, role, class_id, status) VALUES
          (4, 'student2', 'student2@example.com', '$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', '学生用户2', 'student', 1, 1),
          (5, 'student3', 'student3@example.com', '$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', '学生用户3', 'student', 1, 1),
          (6, 'student4', 'student4@example.com', '$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', '学生用户4', 'student', 2, 1);

