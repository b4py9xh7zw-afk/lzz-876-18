          INSERT INTO questions (category_id, type, title, options, answer, analysis, difficulty, score, created_by, status) VALUES
          (4, 'single_choice', '下列哪个属于操作系统的进程调度算法？', '{"A": "时间片轮转", "B": "冒泡排序", "C": "二分查找", "D": "快速排序"}', 'A', '时间片轮转是典型的进程调度算法，其余均为查找/排序算法', 2, 2.00, 2, 1),
          (5, 'single_choice', '栈这种数据结构遵循的存取原则是？', '{"A": "先进先出", "B": "后进先出", "C": "随机存取", "D": "按关键字存取"}', 'B', '栈遵循后进先出(LIFO)原则', 1, 2.00, 2, 1),
          (5, 'true_false', '队列是一种后进先出的线性数据结构。', NULL, 'false', '队列是先进先出(FIFO)，栈才是后进先出', 2, 1.00, 2, 1),
          (8, 'multiple_choice', '下列哪些是 MySQL 中常用的数据类型？', '{"A": "INT", "B": "VARCHAR", "C": "PHOTO", "D": "DATETIME"}', 'ABD', 'PHOTO 不是 MySQL 内置数据类型', 1, 3.00, 2, 1);

          CREATE TABLE IF NOT EXISTS practice_sessions (
              id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              user_id BIGINT UNSIGNED NOT NULL COMMENT '练习学生ID',
              source ENUM('recommendation', 'wrong_questions', 'custom') NOT NULL DEFAULT 'recommendation' COMMENT '练习来源',
              title VARCHAR(200) COMMENT '练习名称',
              question_ids JSON COMMENT '本次练习题目ID列表',
              question_count INT NOT NULL DEFAULT 0 COMMENT '题目数量',
              correct_count INT NOT NULL DEFAULT 0 COMMENT '答对数量',
              total_score DECIMAL(6,2) NOT NULL DEFAULT 0.00 COMMENT '练习总分(非成绩)',
              score DECIMAL(6,2) NOT NULL DEFAULT 0.00 COMMENT '练习得分(非成绩)',
              status ENUM('in_progress', 'finished') NOT NULL DEFAULT 'in_progress' COMMENT '状态',
              started_at TIMESTAMP NULL COMMENT '开始时间',
              finished_at TIMESTAMP NULL COMMENT '完成时间',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
              INDEX idx_user_id (user_id),
              INDEX idx_status (status)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='弱项巩固练习会话表(不计入正式成绩)';

          CREATE TABLE IF NOT EXISTS practice_answers (
              id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              practice_session_id BIGINT UNSIGNED NOT NULL COMMENT '练习会话ID',
              question_id BIGINT UNSIGNED NOT NULL COMMENT '题目ID',
              answer TEXT COMMENT '学生答案',
